name: Build Magic Heroes APK

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Run unit tests
        run: bash gradlew testDebugUnitTest

      - name: Compile Android instrumented tests
        run: bash gradlew compileDebugAndroidTestKotlin

      - name: Build debug APK
        run: bash gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MagicHeroesTournamentManager-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
