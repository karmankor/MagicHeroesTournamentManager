name: Build Magic Heroes APK

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Run unit tests
        run: bash gradlew testDebugUnitTest

      - name: Compile Android instrumented tests
        run: bash gradlew compileDebugAndroidTestKotlin

      - name: Run instrumented tests on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disk-size: 2048M
          ram-size: 2048M
          # Hosted runners can have less free space than Android API 36's default
          # userdata image requires. Remove preinstalled tools not needed by this app
          # after the SDK/AVD has been created but before the emulator allocates userdata.
          pre-emulator-launch-script: |
            sudo rm -rf /usr/share/dotnet /opt/hostedtoolcache/CodeQL /usr/local/share/powershell
            sudo rm -rf /usr/local/lib/android/sdk/ndk /usr/local/lib/android/sdk/cmake
            df -h /
          emulator-boot-timeout: 180
          script: bash gradlew connectedDebugAndroidTest

      - name: Build debug APK
        run: bash gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MagicHeroesTournamentManager-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
